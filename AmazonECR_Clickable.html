<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECR Access Path</title>
<style>
:root {
  --bg: #12161C; --panel: #1A2029; --panel-border: #2A323D;
  --text: #E7EAEE; --text-muted: #9AA5B1;
  --gold: #C9A227; --gold-soft: #8A6D1E;
  --pass: #4CAF7D; --caution: #E0A952; --finding: #E0625A;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; background: transparent; color: var(--text); font-family: var(--sans); line-height:1.5; }
.wrap { max-width: 980px; margin: 0 auto; background: var(--bg); padding: 24px 20px 28px; border-radius: 8px; }
h1 { font-size: 22px; margin: 0 0 8px; font-weight:700; letter-spacing:-0.01em; }
.intro { color: var(--text-muted); font-size: 14.5px; max-width: 700px; margin-bottom: 20px; }
.hint { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; text-align:center; }
.node-btn {
  font-family: var(--sans); cursor: pointer; text-align: center;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
  color: var(--text); transition: border-color 0.2s ease, background 0.2s ease;
}
.node-btn:hover { border-color: var(--gold-soft); }
.node-btn.active { border-color: var(--gold); background: rgba(201,162,39,0.1); }
.node-label { font-weight:700; font-size: 14.5px; margin-bottom: 3px; }
.node-hint { font-size: 12px; color: var(--text-muted); }
.detail-panel {
  margin-top: 18px; padding: 18px 20px; border-radius: 8px;
  background: rgba(201,162,39,0.06); border: 1px solid var(--gold-soft);
  min-height: 90px;
}
.detail-title { font-weight: 700; font-size: 15px; color: var(--gold); margin-bottom: 8px; }
.detail-text { font-size: 14px; color: var(--text); }
.detail-placeholder { color: var(--text-muted); font-size: 14px; font-style: italic; }


.branch-wrap { display:flex; flex-direction:column; align-items:center; gap: 10px; margin-top: 10px; }
.branch-wrap .node-btn.top { max-width: 420px; padding: 14px 18px; }
.branch-arrow { color: var(--text-muted); font-size: 20px; }
.branch-row { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 700px; }
.branch-row .node-btn { padding: 14px 16px; text-align:left; }
.branch-row .node-btn.pass { border-color: var(--pass); background: rgba(76,175,125,0.08); }
.branch-row .node-btn.pass.active { border-color: var(--pass); background: rgba(76,175,125,0.18); }
.branch-row .node-btn.finding { border-color: var(--finding); background: rgba(224,98,90,0.08); }
.branch-row .node-btn.finding.active { border-color: var(--finding); background: rgba(224,98,90,0.18); }
.branch-label.pass { color: var(--pass); font-weight:700; font-size:14px; margin-bottom:4px; }
.branch-label.finding { color: var(--finding); font-weight:700; font-size:14px; margin-bottom:4px; }
.branch-desc { font-size: 13px; color: var(--text-muted); }

</style>
</head>
<body>
<div class="wrap">
  <h1>ECR Access Path</h1>
  <p class="intro">Same policy mechanism, two very different outcomes — the difference is entirely in how the principal is scoped.</p>
  
<div class="branch-wrap">
  <button class="node-btn top" id="btn-policy" onclick="selectNode('policy')"><div class="node-label">Repository Policy / IAM Policy</div></button>
  <div class="branch-arrow">&#8595;</div>
  <div class="branch-row">
    <button class="node-btn pass" id="btn-scoped" onclick="selectNode('scoped')"><div class="branch-label pass">Scoped Grant</div><div class="branch-desc">Principal is a specific account or role.</div></button>
    <button class="node-btn finding" id="btn-wildcard" onclick="selectNode('wildcard')"><div class="branch-label finding">Wildcard Principal</div><div class="branch-desc">Principal is "*" — any AWS account can pull.</div></button>
  </div>
</div>

  <p class="hint">Click any box to learn more.</p>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-placeholder">Click a component above to see a fuller explanation.</div>
  </div>
</div>
<script>
const details = {"policy": {"title": "Repository Policy / IAM Policy", "text": "ECR access can be governed by two mechanisms, either of which can grant a pull or push: a repository policy attached directly to the ECR repository, and IAM policies attached to users, roles, or groups within the AWS account. Both are worth reading during a review \u2014 an organization that's locked down IAM tightly can still have a repository policy that quietly grants broader access than intended."}, "scoped": {"title": "Scoped Grant \u2014 Pass", "text": "A scoped grant names a specific account ID, role, or principal in the policy statement \u2014 access matches exactly what was intended, and nothing more. This is what a well-configured ECR repository policy looks like: deliberate, auditable, and limited to the parties that actually need access. When you find this, it's worth confirming the scoping was a deliberate decision (and ideally documented) rather than just an accident of a narrow use case that happened to end up scoped correctly."}, "wildcard": {"title": "Wildcard Principal \u2014 Finding", "text": "A wildcard principal (a policy statement with \"Principal\": \"*\") means any AWS account, not just the ones the organization intended, can pull from the repository. This is a classic ECR misconfiguration precisely because it's easy to introduce accidentally \u2014 for example, when following a tutorial or troubleshooting a permissions error by loosening a policy \"just to get it working,\" then never tightening it back up. The fix is always the same: replace the wildcard with the specific account IDs or roles that actually need access."}};
function selectNode(key) {
  document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + key).classList.add('active');
  const panel = document.getElementById('detailPanel');
  const d = details[key];
  panel.innerHTML = '<div class="detail-title">' + d.title + '</div><div class="detail-text">' + d.text + '</div>';
}
</script>
</body>
</html>
